<!doctype html><html lang="is"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#21665F" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0F1515" media="(prefers-color-scheme: dark)">
<meta name="description" content="Dagatal, dagbók og verkefnalisti sem brýtur stór verkefni niður í lítil skref.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Skref"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Skref fyrir skref</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
/* Layout: sticky header with tabs; each view is a two-column grid that stacks on phones; one modal sheet for all editing. */
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --surface-2:#F5F8F7; --ink:#1B2627; --muted:#566463; --line:#D3DCDA;
  --accent:#21665F; --accent-ink:#FFFFFF; --accent-soft:#DAEAE6;
  --next:#F0B23C; --next-soft:#FBEFD4; --next-ink:#2B1F03;
  --c-verkefni:#21665F; --c-admin:#6A55B0; --c-fundur:#2F6AA8; --c-dagskra:#86761A;
  --ok:#2E7D4F; --warn:#9A5B00;
  --font-d:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-b:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:12px; --hour:46px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1515; --surface:#172020; --surface-2:#1C2726; --ink:#E3EBE9; --muted:#9AAAA8; --line:#2C3938;
  --accent:#62B8AE; --accent-ink:#0A1413; --accent-soft:#1D3532;
  --next:#F0B23C; --next-soft:#352A12; --next-ink:#2B1F03;
  --c-verkefni:#62B8AE; --c-admin:#A898E6; --c-fundur:#79ABE2; --c-dagskra:#CDBB5C;
  --ok:#6CC28F; --warn:#E9A94B; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0F1515; --surface:#172020; --surface-2:#1C2726; --ink:#E3EBE9; --muted:#9AAAA8; --line:#2C3938;
  --accent:#62B8AE; --accent-ink:#0A1413; --accent-soft:#1D3532;
  --next:#F0B23C; --next-soft:#352A12; --next-ink:#2B1F03;
  --c-verkefni:#62B8AE; --c-admin:#A898E6; --c-fundur:#79ABE2; --c-dagskra:#CDBB5C;
  --ok:#6CC28F; --warn:#E9A94B; color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--font-d);font-weight:700;text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap}
.brand{font-family:var(--font-d);font-weight:700;font-size:22px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand svg{color:var(--accent)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;order:3;flex-basis:100%}
@media (min-width:760px){ nav.tabs{order:0;flex-basis:auto} }
.tab{border:0;background:none;padding:8px 14px;border-radius:999px;color:var(--muted);font-weight:700}
.tab[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.top .spacer{flex:1}

main{padding-block:24px 64px}
.eyebrow{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hello{display:grid;gap:6px;margin-bottom:22px}
.hello h1{font-size:clamp(26px,4vw,36px);font-weight:500}

.grid2{display:grid;gap:20px;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}
@media (max-width:860px){ .grid2{grid-template-columns:minmax(0,1fr)} }
.col{display:grid;gap:20px;min-width:0}
.calgrid{grid-template-columns:minmax(0,2.4fr) minmax(0,1fr)}
@media (max-width:860px){ .calgrid{grid-template-columns:minmax(0,1fr)} }

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0}
.panel h2{font-size:19px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:14px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 15px;border-radius:999px;font-weight:700;display:inline-flex;align-items:center;gap:8px;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.go{background:var(--next);color:var(--next-ink);border-color:var(--next)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.sm{padding:6px 11px;font-size:14px}
.btn.danger{color:#B3261E;border-color:color-mix(in srgb,#B3261E 40%,var(--line))}
.icon-btn{border:1px solid transparent;background:none;width:36px;height:36px;border-radius:999px;display:inline-grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{border-color:var(--line);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip:disabled{opacity:.4;cursor:not-allowed}

/* type colors */
.t-verkefni{--tc:var(--c-verkefni)} .t-admin{--tc:var(--c-admin)} .t-fundur{--tc:var(--c-fundur)} .t-dagskra{--tc:var(--c-dagskra)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--tc)}
.badge::before{content:"";flex:none;width:8px;height:8px;border-radius:2px;background:var(--tc)}
.step .meta .badge{flex-basis:100%}

/* next step */
.next{background:var(--next-soft);border:1px solid color-mix(in srgb,var(--next) 55%,transparent);border-radius:16px;padding:22px;display:grid;gap:12px}
.next .label{font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--warn)}
.next h2{font-size:clamp(24px,3.4vw,32px);font-weight:700}
.next .meta{color:var(--muted);display:flex;gap:6px 12px;flex-wrap:wrap;font-size:15px}
.next .hint{font-size:14px;color:var(--muted)}

/* step rows */
.steps{display:grid;gap:2px}
.step{display:flex;align-items:flex-start;gap:10px;padding:8px 6px;border-radius:8px;min-width:0}
.step:hover{background:var(--surface-2)}
.step .body{flex:1;min-width:0;display:grid;gap:2px}
.step .title{border:0;background:none;padding:0;text-align:left;font-weight:700;overflow-wrap:anywhere}
.step .meta{font-size:13px;color:var(--muted);display:flex;gap:4px 10px;flex-wrap:wrap}
.step.done .title{text-decoration:line-through;color:var(--muted);font-weight:400}
.step.waiting .title{color:var(--muted)}
.chk{flex:none;width:24px;height:24px;margin-top:1px;border-radius:7px;border:2px solid var(--muted);background:var(--surface);display:grid;place-items:center;padding:0;color:transparent}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.chk:disabled{opacity:.35;cursor:not-allowed}
.group-title{font-size:13px;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:center;margin-top:6px}
.slotchip{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700}

/* agenda */
.agenda{display:grid;gap:6px}
.ag{display:grid;grid-template-columns:58px minmax(0,1fr);gap:10px;align-items:start;padding:8px 10px;border-radius:8px;background:var(--surface-2);border-left:4px solid var(--tc)}
.ag time{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.ag .t{font-weight:700;overflow-wrap:anywhere}
.ag button.t{border:0;background:none;padding:0;text-align:left}
.ag .s{font-size:13px;color:var(--muted)}
.empty-line{color:var(--muted);font-size:15px}

/* cards */
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.card:hover{border-color:var(--tc)}
.card h3{font-size:19px;overflow-wrap:anywhere}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar span{display:block;height:100%;background:var(--tc)}
.card .meta{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .nextline{font-size:14px;overflow-wrap:anywhere}
.waitline{font-size:14px;color:var(--warn);font-weight:700}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cal-head h1{font-size:28px;font-weight:500}
.cal-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.cal{display:grid;grid-template-columns:52px repeat(7,minmax(96px,1fr));min-width:740px}
.cal .dh{position:sticky;top:0;padding:10px 6px;text-align:center;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);background:var(--surface)}
.cal .dh b{display:block;font-family:var(--font-d);font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.cal .dh.today b{color:var(--accent)}
.cal .dh.today{box-shadow:inset 0 -3px 0 var(--accent)}
.hours{display:grid}
.hours div{height:var(--hour);font-size:12px;color:var(--muted);text-align:right;padding-right:8px;transform:translateY(-8px);font-variant-numeric:tabular-nums}
.dcol{position:relative;border-left:1px solid var(--line)}
.dcol.today{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.cell{display:block;width:100%;height:var(--hour);border:0;border-top:1px solid var(--line);background:none;padding:0}
.cell:hover{background:var(--surface-2)}
.blk{position:absolute;border:0;border-radius:7px;padding:3px 6px;text-align:left;font-size:12px;line-height:1.25;overflow:hidden;
  background:color-mix(in srgb,var(--tc) 18%,var(--surface));color:var(--ink);box-shadow:inset 3px 0 0 var(--tc), 0 0 0 1px color-mix(in srgb,var(--tc) 35%,transparent)}
.blk{display:flex;flex-direction:column;justify-content:flex-start;gap:1px}
.blk b,.blk span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.blk.step{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--tc) 12%,var(--surface)) 0 6px,color-mix(in srgb,var(--tc) 18%,var(--surface)) 6px 12px)}
.blk.done{opacity:.5;text-decoration:line-through}
.blk span{font-variant-numeric:tabular-nums;color:var(--muted)}

/* journal */
.paper{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:16px;min-width:0}
.paper textarea{width:100%;min-height:340px;resize:vertical;border:0;background:
  repeating-linear-gradient(to bottom,transparent 0 31px,var(--line) 31px 32px);line-height:32px;font-size:17px;padding:0 2px;outline:none}
.paper textarea:focus-visible{outline:2px dashed var(--line);outline-offset:6px}
.datenav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.datenav h1{font-size:26px;font-weight:500;flex:1;min-width:0}
.field-label{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.save-state{font-size:13px;color:var(--muted)}
.prompts{display:flex;gap:6px;flex-wrap:wrap}
.prompts .chip{font-weight:400;color:var(--ink)}
.past{display:grid;gap:4px}
.past button{border:0;background:none;text-align:left;padding:8px;border-radius:8px;display:grid;gap:2px}
.past button:hover{background:var(--surface-2)}
.past b{font-size:14px}
.past span{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* modal */
#modal{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,#000 45%,transparent);display:grid;place-items:center;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#modal[hidden]{display:none}
.sheet{background:var(--bg);border-radius:16px;width:min(760px,100%);max-height:100%;overflow:auto;padding:22px;display:grid;gap:18px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sheet-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.sheet-head h2{font-size:24px}
.sheet .sec{display:grid;gap:10px}
.sheet .sec h3{font-size:16px}
label.f{display:grid;gap:4px;font-size:14px;font-weight:700;color:var(--muted)}
.inp, .sheet input[type=text], .sheet input[type=date], .sheet input[type=time], .sheet select, .sheet textarea{
  width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 11px;color:var(--ink);font-weight:400;font-size:16px;min-width:0}
.sheet textarea{min-height:76px;resize:vertical}
.title-inp{font-family:var(--font-d);font-size:24px !important;font-weight:700 !important;border-color:transparent !important;background:transparent !important;padding:2px 4px !important}
.title-inp:hover,.title-inp:focus{border-color:var(--line) !important;background:var(--surface) !important}
.fgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.phases{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.phase{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:4px;align-content:start;min-width:0}
.phase-h{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:0 6px}
.coach{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:15px;display:grid;gap:4px}
.warnline{font-size:13px;color:var(--warn);font-weight:700}
.wsteps{display:grid;gap:8px}
.wstep{display:grid;grid-template-columns:28px minmax(0,1fr) 110px 36px;gap:8px;align-items:center}
.wstep .n{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;text-align:right}
@media (max-width:520px){ .wstep{grid-template-columns:22px minmax(0,1fr) 36px} .wstep select{grid-column:2} }
.typepick{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.typepick button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;display:grid;gap:6px}
.typepick button:hover{border-color:var(--tc)}
.typepick b{font-family:var(--font-d);font-size:19px}
.typepick span{font-size:14px;color:var(--muted)}
.dots{display:flex;gap:6px}
.dots i{width:24px;height:5px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--accent)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.err{color:#B3261E;font-size:14px;font-weight:700}
.placelist{display:grid;gap:4px;max-height:320px;overflow:auto}
.placelist button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 12px;text-align:left;display:grid;gap:1px}
.placelist button:hover{border-color:var(--accent)}
.placelist small{color:var(--muted)}

/* timer */
.timer{text-align:center;display:grid;gap:14px;justify-items:center;padding-block:10px}
.timer .clock{font-family:var(--font-d);font-size:clamp(64px,16vw,104px);font-weight:500;font-variant-numeric:tabular-nums;line-height:1}
.ring{width:220px;max-width:100%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--next) calc(var(--p,0)*1turn),var(--line) 0)}
.ring>div{width:84%;height:84%;border-radius:50%;background:var(--bg);display:grid;place-items:center}

/* sub-projects */
.step.sub{background:color-mix(in srgb,var(--tc) 7%,transparent);border:1px dashed color-mix(in srgb,var(--tc) 45%,var(--line));align-items:center}
.subicon{flex:none;color:var(--tc);display:grid;place-items:center;width:24px}
.subtag{color:var(--tc);font-weight:700}
.step.sub.done .title{text-decoration:none;color:var(--ok);font-weight:700}
.bar.mini{height:5px;margin-top:4px}
.bar{position:relative}
.bar i{position:absolute;top:0;bottom:0;width:2px;background:var(--surface);z-index:1}
.phase-ok{color:var(--ok)}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input{flex:1 1 200px;min-width:0}
.addrow select{flex:0 0 auto;width:auto !important}
.split-opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.split-opts .btn{border-radius:10px;text-align:left;font-weight:400}
.split-opts b{display:block}
.split-opts small{display:block;color:var(--muted);font-size:13px}
.reward-f{color:var(--warn)}
.reward-f svg{vertical-align:-2px}
.reward-line{font-size:14px;color:var(--warn);font-weight:700;display:flex;gap:6px;align-items:center;overflow-wrap:anywhere}
.xp-tag{color:var(--warn);font-weight:700}

/* game */
.lvl-pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;display:inline-flex;align-items:center;gap:8px;font-size:14px}
.pill-bar{display:block;width:54px;height:6px;border-radius:9px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.pill-bar span{display:block;height:100%;background:var(--next)}
.gstrip{text-align:left;cursor:pointer;font:inherit;color:inherit}
.gstrip:hover{border-color:var(--next)}
.lvl{display:grid;gap:6px;width:100%}
.lvl-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.lvl-top b{color:var(--ink)}
.lvl .bar span, .levelcard .bar span{background:var(--next)}
.bar.big{height:14px}
.weekdots{display:flex;gap:6px}
.wd{flex:1;display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--muted)}
.wd i{width:100%;max-width:34px;aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:block}
.wd.on i{background:var(--next);border:2px solid var(--next)}
.wd.now{color:var(--ink);font-weight:700}
.levelcard h2{font-size:34px}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;border-top:1px solid var(--line);padding-top:12px}
.statrow div{display:grid}
.statrow b{font-family:var(--font-d);font-size:26px;font-variant-numeric:tabular-nums}
.statrow span{font-size:13px;color:var(--muted)}
.badges{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.bdg{border:1px dashed var(--line);border-radius:12px;padding:12px;display:grid;gap:4px;justify-items:center;text-align:center;color:var(--muted)}
.bdg svg{color:var(--line)}
.bdg b{font-size:14px}
.bdg span{font-size:12px}
.bdg.got{border:1px solid color-mix(in srgb,var(--next) 60%,var(--line));background:var(--next-soft);color:var(--ink)}
.bdg.got svg{color:var(--next)}
.avail{font-weight:700;color:var(--warn);font-variant-numeric:tabular-nums}
.rewards{display:grid;gap:6px}
.rw{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;background:var(--surface-2)}
.rw .body{flex:1;min-width:0;display:grid}
.rw .btn:disabled{opacity:.7;cursor:default}
.howto{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.howto li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.howto b{color:var(--warn);font-variant-numeric:tabular-nums;white-space:nowrap}
#party{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,#000 50%,transparent);display:grid;place-items:center;padding:16px}
#party[hidden]{display:none}
.party-card{background:var(--surface);border-radius:20px;padding:28px 24px;width:min(440px,100%);display:grid;gap:14px;text-align:center;justify-items:center;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.party-card h2{font-size:30px}
.party-xp{font-family:var(--font-d);font-weight:700;color:var(--warn);font-size:20px}
.party-reward{display:flex;gap:12px;align-items:center;text-align:left;background:var(--next-soft);border-radius:12px;padding:12px 16px;width:100%;color:var(--warn)}
.party-reward svg{width:24px;height:24px;flex:none}
.party-reward small{display:block;color:var(--muted)}
.party-reward b{color:var(--ink);font-size:18px}
.pchip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;background:var(--surface-2);border-radius:999px;padding:4px 10px;color:var(--ink)}
.pchip svg{color:var(--next)}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:41;pointer-events:none}
@media (prefers-reduced-motion:no-preference){ #party:not([hidden]) .party-card{animation:pop .4s cubic-bezier(.2,1.4,.4,1)} @keyframes pop{from{transform:scale(.85);opacity:.6}to{transform:none;opacity:1}} }

/* reminders, ai, settings */
#reminders{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:35;display:grid;gap:10px;width:min(380px,calc(100% - 24px))}
.rem{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid color-mix(in srgb,var(--next) 60%,var(--line));border-radius:14px;padding:14px;box-shadow:0 12px 36px rgba(0,0,0,.18)}
.rem-ic{flex:none;width:34px;height:34px;border-radius:50%;background:var(--next-soft);color:var(--warn);display:grid;place-items:center}
.rem-ic svg{width:18px;height:18px}
.rem-b{flex:1;min-width:0;display:grid;gap:4px}
.rem-b span{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
@media (prefers-reduced-motion:no-preference){ .rem{animation:slidein .3s ease-out} @keyframes slidein{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}} }
.ai{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.ai-btn{border-color:color-mix(in srgb,var(--c-admin) 50%,var(--line));color:var(--c-admin)}
.ai-think{color:var(--c-admin);font-weight:700;display:inline-flex;gap:6px;align-items:center}
@media (prefers-reduced-motion:no-preference){ .ai-think svg{animation:spin 1.6s linear infinite} @keyframes spin{to{transform:rotate(360deg)}} }
.ai-done{display:grid;gap:8px;background:color-mix(in srgb,var(--c-admin) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--c-admin) 35%,var(--line));border-radius:12px;padding:12px}
.ai-head{display:flex;gap:6px;align-items:center;color:var(--c-admin)}
.ai-head b{color:var(--ink)}
.ai-list{display:grid;gap:4px}
.ai-row{display:flex;gap:10px;align-items:flex-start;text-align:left;border:0;background:none;padding:6px;border-radius:8px}
.ai-row:hover{background:var(--surface)}
.ai-row b{display:block;font-weight:700}
.ai-row small{display:block;color:var(--muted);font-size:13px}
.ai-row .chk{pointer-events:none}
.ai-row[aria-pressed="true"] .chk{background:var(--c-admin);border-color:var(--c-admin);color:#fff}
.ai-row[aria-pressed="false"] b{color:var(--muted);text-decoration:line-through}
.note-box{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;font-size:inherit}
label.btn{cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:700;max-width:calc(100% - 32px);text-align:center}
.note{font-size:13px;color:var(--muted);text-align:center;margin-top:28px}
.emptyhero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;display:grid;gap:14px;max-width:680px}
.emptyhero h2{font-size:28px}
.emptyhero ol{margin:0;padding-left:20px;display:grid;gap:4px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){ .next{animation:rise .35s ease-out} @keyframes rise{from{transform:translateY(6px)}to{transform:none}} }

<script>
(() => {
'use strict';
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = fromISO(s); d.setDate(d.getDate() + n); return iso(d); };
const today = () => iso(new Date());
const mondayOf = s => { const d = fromISO(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return iso(d); };
const DAYS = ['sunnudagur','mánudagur','þriðjudagur','miðvikudagur','fimmtudagur','föstudagur','laugardagur'];
const DS = ['sun','mán','þri','mið','fim','fös','lau'];
const MONTHS = ['janúar','febrúar','mars','apríl','maí','júní','júlí','ágúst','september','október','nóvember','desember'];
const fmtLong = s => { const d = fromISO(s); return `${DAYS[d.getDay()]} ${d.getDate()}. ${MONTHS[d.getMonth()]}`; };
const fmtShort = s => { const d = fromISO(s); return `${DS[d.getDay()]} ${d.getDate()}. ${MONTHS[d.getMonth()].slice(0,3)}.`; };
const toMin = t => { const [h, m] = (t || '0:0').split(':').map(Number); return h * 60 + (m || 0); };
const fromMin = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const fmtDur = m => m < 60 ? `${m} mín` : (m % 60 ? `${Math.floor(m / 60)} klst ${m % 60} mín` : `${m / 60} klst`);
const weekNo = s => { const d = fromISO(s); d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7); const w1 = new Date(d.getFullYear(), 0, 4);
  return 1 + Math.round(((d - w1) / 864e5 - 3 + (w1.getDay() + 6) % 7) / 7); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const MINS = [5,10,15,20,30,45,60,90,120,180,240];
const TYPES = {
  verkefni: { label:'Verkefni', desc:'Eitthvað stórt sem þarf að brjóta niður í viðráðanleg skref.' },
  admin:    { label:'Admin', desc:'Póstar, símtöl, umsóknir og eyðublöð sem sitja á sér.' },
  fundur:   { label:'Fundur', desc:'Ákveðinn tími með öðru fólki.' },
  dagskra:  { label:'Dagskrá', desc:'Fastir liðir: sækja, æfingar, viðburðir.' },
};
const ENERGY = { low:'Lítil orka', mid:'Miðlungs orka', high:'Mikil orka' };
const MOODS = ['Mjög erfitt','Þungt','Allt í lagi','Gott','Mjög gott'];
const PROMPTS = ['Hvað er að stoppa mig núna?','Hvað er minnsta skrefið sem ég get tekið?','Hvað tókst í dag, þótt það sé lítið?','Hvað var erfitt og af hverju?','Hverju má sleppa á morgun?'];
const ICON = {
  check:'<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  play:'<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3l8 5-8 5z" fill="currentColor"/></svg>',
  cal:'<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="2.5" y="3.5" width="13" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M2.5 7.5h13M6 2v3M12 2v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  x:'<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  gift:'<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="6" width="12" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M1.5 6h13M8 6v8M8 6C6 2 3 3.5 5 6M8 6c2-4 5-2.5 3 0" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
  bell:'<svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true" style="vertical-align:-2px"><path d="M4 11V7a4 4 0 018 0v4l1.5 1.5h-11zM6.5 14a1.5 1.5 0 003 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
  spark:'<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5l1.6 4.2 4.4 1.3-4.4 1.3L8 12.5 6.4 8.3 2 7l4.4-1.3zM13 11l.7 1.6 1.3.4-1.3.4L13 15l-.7-1.6L11 13l1.3-.4z" fill="currentColor"/></svg>',
  gear:'<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.7 3.7l1.4 1.4M12.9 12.9l1.4 1.4M3.7 14.3l1.4-1.4M12.9 5.1l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  tree:'<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="2" y="2.5" width="8" height="5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="12" y="9" width="8" height="5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="12" y="15.5" width="8" height="5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M6 7.5V18h6M6 11.5h6" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>',
  link:'<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M7.5 10.5l3-3M6 8.5L4.5 10a2.5 2.5 0 003.5 3.5L9.5 12M12 9.5L13.5 8A2.5 2.5 0 0010 4.5L8.5 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  medal:'<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="M13 3h5l3 9h-5zM27 3h-5l-3 9h5z" fill="currentColor" opacity=".55"/><circle cx="20" cy="25" r="11" fill="currentColor"/><path d="M20 18.5l2 4.2 4.6.6-3.4 3.2.9 4.5-4.1-2.3-4.1 2.3.9-4.5-3.4-3.2 4.6-.6z" fill="var(--surface)"/></svg>',
};

/* ---------- state ---------- */
const S = {
  items: [], journal: {}, loaded: false, slow: false, local: false,
  view: 'idag', weekStart: mondayOf(today()), jDate: today(),
  skip: new Set(), f: { min: null, energy: null }, filter: 'virkt',
  modal: null, confirm: null,
};
try { const v = localStorage.getItem('skref-view'); if (v) S.view = v; } catch {}

const newItem = (type, o = {}) => ({ id: uid(), type, title: '', why: '', reward: '', to: '', subject: '', more: '', date: '', start: '', end: '', notes: '', repeat: { freq: 'none', days: [], until: '' }, except: [], remind: null,
  steps: [], dependsOn: [], parentId: null, parentStepId: null, archived: false, createdAt: Date.now(), updatedAt: Date.now(), ...o });
const newStep = (o = {}) => ({ id: uid(), title: '', minutes: 15, energy: 'mid', done: false, doneAt: null, slot: null, remind: null, dependsOn: [], subId: null, ...o });
const getItem = id => id ? S.items.find(i => i.id === id) : undefined;
const getStep = (item, sid) => item?.steps.find(s => s.id === sid);
const isEvent = it => it.type === 'fundur' || it.type === 'dagskra';
/* a step that has been turned into a sub-project is done when that sub-project is done */
const sd = s => { const c = s.subId && getItem(s.subId); return c ? itemDone(c) : !!s.done; };
const itemDone = it => it.steps.length > 0 && it.steps.every(sd);
const depsDone = (it, s) => (s.dependsOn || []).every(d => { const o = getStep(it, d); return !o || sd(o); });
const itemUnblocked = it => {
  if (!(it.dependsOn || []).every(id => { const o = getItem(id); return !o || o.archived || itemDone(o); })) return false;
  const p = getItem(it.parentId); if (!p) return true;
  const ps = getStep(p, it.parentStepId); return itemUnblocked(p) && (!ps || depsDone(p, ps));
};
const stepReady = (it, s) => !sd(s) && itemUnblocked(it) && depsDone(it, s);
const active = () => S.items.filter(i => !i.archived && !rootOf(i).archived);
const rootOf = it => { let c = it, n = 0; while (c.parentId && getItem(c.parentId) && n++ < 20) c = getItem(c.parentId); return c; };
const crumb = it => { const p = getItem(it.parentId); return p ? `${crumb(p)} › ${it.title}` : it.title; };
const chainOf = it => { const out = [it]; let c = it; while (getItem(c.parentId) && out.length < 20) { c = getItem(c.parentId); out.push(c); } return out; };
const descendants = it => [it, ...it.steps.filter(s => getItem(s.subId)).flatMap(s => descendants(getItem(s.subId)))];
const counts = it => it.steps.reduce((a, s) => { const c = getItem(s.subId); if (c) { const k = counts(c); a.n += k.n; a.d += k.d; } else { a.n++; if (s.done) a.d++; } return a; }, { n: 0, d: 0 });
const donePhases = it => phases(it).filter(p => p.every(sd)).length;
function phases(it) {
  const by = new Map(it.steps.map(s => [s.id, s])), memo = new Map();
  const lvl = (s, seen) => { if (memo.has(s.id)) return memo.get(s.id); if (seen.has(s.id)) return 0; seen.add(s.id);
    let l = 0; for (const d of s.dependsOn || []) { const o = by.get(d); if (o) l = Math.max(l, lvl(o, seen) + 1); } memo.set(s.id, l); return l; };
  const out = []; for (const s of it.steps) { const l = lvl(s, new Set()); (out[l] ||= []).push(s); } return out.filter(Boolean);
}
const reaches = (it, fromId, targetId, seen = new Set()) => { if (fromId === targetId) return true; if (seen.has(fromId)) return false; seen.add(fromId);
  const s = getStep(it, fromId); return (s?.dependsOn || []).some(d => reaches(it, d, targetId, seen)); };
const itemReaches = (fromId, targetId, seen = new Set()) => { if (fromId === targetId) return true; if (seen.has(fromId)) return false; seen.add(fromId);
  return (getItem(fromId)?.dependsOn || []).some(d => itemReaches(d, targetId, seen)); };
function readySteps() { const out = []; for (const it of active()) for (const s of it.steps) if (!getItem(s.subId) && stepReady(it, s)) out.push({ it, s }); return out; }
function pickNext() {
  const t = today();
  let c = readySteps().filter(({ s }) => !S.skip.has(s.id) && !(s.slot && s.slot.date > t));
  if (S.f.min) c = c.filter(({ s }) => s.minutes <= S.f.min);
  if (S.f.energy) c = c.filter(({ s }) => s.energy === S.f.energy);
  const rank = ({ s }) => s.slot?.date === t ? 0 : s.slot ? 1 : 2;
  c.sort((a, b) => rank(a) - rank(b) || (a.s.slot && b.s.slot ? toMin(a.s.slot.start) - toMin(b.s.slot.start) : 0) || a.s.minutes - b.s.minutes || a.it.createdAt - b.it.createdAt);
  return c[0] || null;
}
/* ---------- recurrence ---------- */
const REPEATS = [['none','Endurtekst ekki'],['daily','Daglega'],['weekdays','Virka daga'],['weekly','Vikulega'],['biweekly','Aðra hverja viku'],['monthly','Mánaðarlega']];
const REM = [['','Engin áminning'],['0','Þegar það byrjar'],['5','5 mín áður'],['10','10 mín áður'],['15','15 mín áður'],['30','30 mín áður'],['60','1 klst áður'],['1440','Daginn áður']];
const remLabel = m => (REM.find(([v]) => v === String(m)) || [, ''])[1];
const repDays = it => it.repeat?.days?.length ? it.repeat.days : [fromISO(it.date).getDay()];
function occursOn(it, d) {
  if (!it.date || d < it.date) return false;
  const r = it.repeat || { freq: 'none' };
  if (r.until && d > r.until) return false;
  if ((it.except || []).includes(d)) return false;
  const x = fromISO(d), dow = x.getDay();
  switch (r.freq) {
    case 'daily': return true;
    case 'weekdays': return dow >= 1 && dow <= 5;
    case 'weekly': return repDays(it).includes(dow);
    case 'biweekly': return repDays(it).includes(dow) && Math.round((fromISO(mondayOf(d)) - fromISO(mondayOf(it.date))) / 6048e5) % 2 === 0;
    case 'monthly': return x.getDate() === fromISO(it.date).getDate();
    default: return d === it.date;
  }
}
const repeatText = it => { const r = it.repeat; if (!r || r.freq === 'none') return '';
  const base = REPEATS.find(([k]) => k === r.freq)?.[1] || '';
  const days = (r.freq === 'weekly' || r.freq === 'biweekly') ? ' á ' + repDays(it).slice().sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).map(i => DS[i]).join(', ') : '';
  return base + days + (r.until ? ` til ${fmtShort(r.until)}` : ''); };

function agendaFor(d) {
  const out = [];
  for (const it of active()) {
    if (isEvent(it) && occursOn(it, d)) out.push({ kind: 'ev', it, d, start: it.start || '', end: it.end || '' });
    for (const s of it.steps) if (s.slot?.date === d) out.push({ kind: 'st', it, s, start: s.slot.start, end: fromMin(Math.min(toMin(s.slot.start) + s.minutes, 1439)) });
  }
  return out.sort((a, b) => (a.start || '99').localeCompare(b.start || '99'));
}
const winsOn = d => { const out = []; for (const it of S.items) for (const s of it.steps) if (s.doneAt && iso(new Date(s.doneAt)) === d) out.push({ it, s }); return out.sort((a, b) => a.s.doneAt - b.s.doneAt); };
const overdue = () => { const t = today(), out = []; for (const it of active()) for (const s of it.steps) if (!s.done && s.slot && s.slot.date < t) out.push({ it, s }); return out; };
const remaining = it => it.steps.reduce((a, s) => { const c = getItem(s.subId); return a + (c ? remaining(c) : s.done ? 0 : (+s.minutes || 0)); }, 0);

/* ---------- game: points are derived from what is done, so unticking takes them back ---------- */
const GDEF = () => ({ timerStarts: 0, timerDays: {}, splits: 0, rewards: [], spent: 0, seen: [], morning: '', evening: '' });
S.game = GDEF();
const stepXP = s => 10 + Math.min(30, Math.round((+s.minutes || 0) / 6));
function stats() {
  const st = { xp: 0, steps: 0, phasesDone: 0, subsDone: 0, projDone: 0, adminDone: 0, early: false, jDays: 0 };
  for (const it of S.items) {

/* ---------- store: claude db, with a browser fallback ---------- */
const store = {
  mode: 'local', q: new Map(), busy: new Set(), itemsCol: null, jCol: null,
  async init() {
    let db = null, user = null, id = null;
    try { if (window.claude?.use) [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch {}
    try { id = user ? await user.id() : null; } catch {}
    if (!db || !id) return this.initLocal();
    this.mode = 'db';
    const base = db.doc(`data/users/${id}/profile`);
    this.itemsCol = base.collection('items'); this.jCol = base.collection('journal'); this.gRef = base.collection('meta').doc('game');
    this.gRef.onSnapshot(snap => { if (this.q.has('g')) return; S.game = { ...GDEF(), ...(snap.exists ? structuredClone(snap.data()) : {}) }; render(); }, () => {});
    let gi = false, gj = false;
    const timer = setTimeout(() => { if (!(gi && gj)) { S.slow = true; render(); } }, 10000);
    const settle = () => { if (gi && gj) { clearTimeout(timer); S.slow = false; } };
    this.itemsCol.onSnapshot(snap => {
      const map = new Map(snap.docs.map(d => [d.id, { ...structuredClone(d.data()), id: d.id }]));
      for (const [k, v] of this.q) if (k.startsWith('i:')) { const iid = k.slice(2); v.val === null ? map.delete(iid) : map.set(iid, structuredClone(v.val)); }
      S.items = [...map.values()].map(normalize);
      S.loaded = true; if (!snap.metadata.fromCache) gi = true; settle(); render(); refreshModalIfSafe();
    }, () => { S.loaded = true; S.slow = true; clearTimeout(timer); render(); });
    this.jCol.onSnapshot(snap => {
      const j = {}; for (const d of snap.docs) j[d.id] = structuredClone(d.data());
      for (const [k, v] of this.q) if (k.startsWith('j:')) j[k.slice(2)] = structuredClone(v.val);
      S.journal = j; if (!snap.metadata.fromCache) gj = true; settle();
      if (S.view === 'dagbok') render();
    }, () => {});
  },
  initLocal() {
    this.mode = 'local'; S.local = true;
    try { const raw = localStorage.getItem('skref-data'); if (raw) { const d = JSON.parse(raw); S.items = (d.items || []).map(normalize); S.journal = d.journal || {}; S.game = { ...GDEF(), ...(d.game || {}) }; } } catch {}
    S.loaded = true; render();
  },
  persistLocal() { try { localStorage.setItem('skref-data', JSON.stringify({ items: S.items, journal: S.journal, game: S.game })); } catch {} },
  saveGame() { if (this.mode === 'db') this.put('g', this.gRef, JSON.parse(JSON.stringify(S.game))); else this.persistLocal(); },
  put(key, ref, val) { this.q.set(key, { ref, val }); this.flush(key); },
  async flush(key) {
    if (this.busy.has(key)) return; this.busy.add(key);
    while (this.q.has(key)) {
      const { ref, val } = this.q.get(key); this.q.delete(key);
      const run = () => val === null ? ref.delete() : ref.set(val);
      try { await run(); }
      catch (e) {
        if (e?.code === 'unavailable') { await sleep(600 + Math.random() * 900); try { await run(); } catch { toast('Ekki tókst að vista. Reyndu aftur eftir smá stund.'); } }
        else if (e?.code === 'quota_exceeded') toast('Geymslan er full. Eyddu gömlum verkefnum til að búa til pláss.');
        else toast('Ekki tókst að vista breytinguna.');
      }
    }
    this.busy.delete(key);
  },
  saveItem(it) {
    it.updatedAt = Date.now();
    const i = S.items.findIndex(x => x.id === it.id); if (i < 0) S.items.push(it); else S.items[i] = it;
    if (this.mode === 'db') this.put('i:' + it.id, this.itemsCol.doc(it.id), JSON.parse(JSON.stringify(it))); else this.persistLocal();
  },
  deleteItem(id) {
    const it = getItem(id); if (!it) return;

    const p = getItem(it.parentId), ps = getStep(p, it.parentStepId);
    if (ps) { ps.subId = null; this.saveItem(p); }
    S.items = S.items.filter(x => x.id !== id);
    for (const o of S.items) if (o.dependsOn?.includes(id)) { o.dependsOn = o.dependsOn.filter(d => d !== id); this.saveItem(o); }
    if (this.mode === 'db') this.put('i:' + id, this.itemsCol.doc(id), null); else this.persistLocal();
  },
  saveJournal(date, entry) {
    S.journal[date] = entry;
    if (this.mode === 'db') this.put('j:' + date, this.jCol.doc(date), entry); else this.persistLocal();
  },
};

const H0 = 7, H1 = 23;
function layoutBlocks(blocks) {

  if (cluster.length) finish(); return blocks;

function viewCal() {

        ? `<button class="blk t-${a.it.type}" style="${st}" data-a="open" data-i="${a.it.id}" data-d="${a.d}"><b>${a.it.repeat?.freq && a.it.repeat.freq !== 'none' ? '↻ ' : ''}${esc(a.it.title)}</b><span>${esc(a.start)}${a.end ? '–' + esc(a.end) : ''}</span></button>`
        : `<button class="blk step t-${a.it.type} ${a.s.done ? 'done' : ''}" style="${st}" data-a="edit-step" data-i="${a.it.id}" data-s="${a.s.id}"><b>${esc(a.s.title)}</b><span>${esc(a.start)} · ${esc(a.it.title)}</span></button>`;
    }).join('');

  }).join('');
  const unsched = readySteps().filter(({ s }) => !s.slot);
  const waiting = []; for (const it of active()) for (const s of it.steps) if (!sd(s) && !s.slot && !getItem(s.subId) && !stepReady(it, s)) waiting.push({ it, s });
  return `<div class="cal-head"><div><p class="eyebrow">Vika ${weekNo(ws)}</p><h1>${range}</h1></div>
      <div class="row"><button class="btn sm" data-a="wk" data-v="-1" aria-label="Fyrri vika">‹ Fyrri</button><button class="btn sm" data-a="wk" data-v="0">Þessi vika</button><button class="btn sm" data-a="wk" data-v="1" aria-label="Næsta vika">Næsta ›</button></div></div>
    <div class="grid2 calgrid">
      <div class="cal-scroll"><div class="cal">
        <div class="dh"></div>${days.map(d => { const x = fromISO(d); return `<div class="dh ${d === t ? 'today' : ''}">${DS[x.getDay()]}<b>${x.getDate()}</b></div>`; }).join('')}
        <div class="hours">${[...Array(H1 - H0)].map((_, i) => `<div>${i ? pad(H0 + i) + ':00' : ''}</div>`).join('')}</div>${cols}
      </div></div>
      <div class="col">
        <section class="panel"><div class="panel-head"><h2>Óraðað</h2><span class="sub">${unsched.length} tilbúin</span></div>
          <p class="sub">Smelltu á tíma í dagatalinu til að setja skref þar, eða notaðu dagatalstáknið.</p>
          ${unsched.length ? `<div class="steps">${unsched.map(({ it, s }) => stepRow(it, s, { showItem: true })).join('')}</div>` : `<p class="empty-line">Ekkert óraðað skref er tilbúið.</p>`}
        </section>
        ${waiting.length ? `<section class="panel"><div class="panel-head"><h2>Bíða eftir öðru</h2><span class="sub">${waiting.length}</span></div><p class="sub">Þessi verða tilbúin þegar skrefin á undan klárast.</p>
          <div class="steps">${waiting.slice(0, 12).map(({ it, s }) => stepRow(it, s, { showItem: true })).join('')}</div></section>` : ''}
      </div>
    </div>` + slowNote() + localNote();
}

function viewProjects() {

  let list = S.items.filter(i => !getItem(i.parentId));
  if (S.filter === 'geymt') list = list.filter(i => i.archived);
  else { list = list.filter(i => !i.archived);
    if (S.filter === 'verkefni' || S.filter === 'admin') list = list.filter(i => i.type === S.filter);

  list.sort((a, b) => (isEvent(a) - isEvent(b)) || (isEvent(a) ? (a.date + a.start).localeCompare(b.date + b.start) : a.createdAt - b.createdAt));
  const card = it => {
    const { d: done, n } = counts(it);

    const ph = phases(it), phd = donePhases(it), subs = descendants(it).length - 1;

      <h3>${esc(it.title)}</h3>

      ${n ? `<div class="bar">${ph.length > 1 ? ph.slice(1).map((_, i) => `<i style="left:${(i + 1) / ph.length * 100}%"></i>`).join('') : ''}<span style="width:${Math.round(done / n * 100)}%"></span></div>

      ${it.reward && !isEvent(it) ? `<p class="reward-line">${ICON.gift} ${esc(it.reward)}</p>` : ''}

        : n && done === n ? `<p class="nextline" style="color:var(--ok);font-weight:700">Öll skref kláruð</p>` : ''}
    </button>`;
  };
  return `<section class="hello"><p class="eyebrow">Yfirlit</p><h1>Verkefni, admin og dagskrá</h1></section>
    <div class="row" style="margin-bottom:16px">${F.map(([k, l]) => `<button class="chip" data-a="filter" data-v="${k}" aria-pressed="${S.filter === k}">${l}</button>`).join('')}</div>
    ${!S.items.length ? emptyHero() : list.length ? `<div class="cards">${list.map(card).join('')}</div>` : `<p class="empty-line">Ekkert hér ennþá.</p>`}` + slowNote() + localNote();
}

async function saveFile(filename, text, mime) {
  if (P.downloads) {
    try { await P.downloads.save({ filename, data: new Blob([text], { type: mime }) }); toast('Skráin er vistuð.'); }
    catch (e) { if (e?.code !== 'declined') toast('Ekki tókst að vista skrána hér. Prófaðu sjálfstæðu útgáfuna af Skref.'); }
    return;
  }
  if (P.inClaude) { toast('Ekki er hægt að vista skrár í þessari sýn.'); return; }
  const file = new File([text], filename, { type: mime });
  try { if (navigator.canShare?.({ files: [file] }) && /iPhone|iPad|Android/i.test(navigator.userAgent)) { await navigator.share({ files: [file], title: filename }); return; } } catch (e) { if (e?.name === 'AbortError') return; }
  const url = URL.createObjectURL(file), a = document.createElement('a'); a.href = url; a.download = filename; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
}

/* ---------- calendar file (.ics) so the phone's own calendar can remind ---------- */
const icsDate = (d, t) => d.replace(/-/g, '') + (t ? 'T' + t.replace(':', '') + '00' : '');
const icsEsc = x => String(x || '').replace(/\\/g, '\\\\').replace(/;/g, '\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
function rruleOf(it) {
  const r = it.repeat, BY = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA']; if (!r || r.freq === 'none' || !r.freq) return '';
  let x = { daily: 'FREQ=DAILY', weekdays: 'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR', weekly: 'FREQ=WEEKLY;BYDAY=' + repDays(it).map(i => BY[i]).join(','),
    biweekly: 'FREQ=WEEKLY;INTERVAL=2;BYDAY=' + repDays(it).map(i => BY[i]).join(','), monthly: 'FREQ=MONTHLY;BYMONTHDAY=' + fromISO(it.date).getDate() }[r.freq] || '';
  if (x && r.until) x += ';UNTIL=' + icsDate(r.until) + 'T235959'; return x;
}
function icsEvent(o, stamp) {
  const L = ['BEGIN:VEVENT', `UID:${o.uid}@skref.app`, `DTSTAMP:${stamp}`, `SUMMARY:${icsEsc(o.title)}`];
  if (o.start) L.push(`DTSTART:${icsDate(o.date, o.start)}`, `DTEND:${icsDate(o.date, o.end && o.end > o.start ? o.end : fromMin(Math.min(toMin(o.start) + 60, 1439)))}`);
  else L.push(`DTSTART;VALUE=DATE:${icsDate(o.date)}`, `DTEND;VALUE=DATE:${icsDate(addDays(o.date, 1))}`);
  if (o.desc) L.push(`DESCRIPTION:${icsEsc(o.desc)}`);
  if (o.rrule) { L.push(`RRULE:${o.rrule}`); for (const x of o.except || []) L.push(o.start ? `EXDATE:${icsDate(x, o.start)}` : `EXDATE;VALUE=DATE:${icsDate(x)}`); }
  if (o.remind != null) L.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(o.title)}`, `TRIGGER:-PT${o.remind}M`, 'END:VALARM');
  L.push('END:VEVENT'); return L;
}
function buildICS(items) {

function toggleDone(id, sid) {
  const it = getItem(id), s = getStep(it, sid); if (!s || getItem(s.subId)) return;
  const chain = chainOf(it), b4 = chain.map(c => ({ done: itemDone(c), ph: donePhases(c) })), st0 = stats(), lv0 = level(st0.xp).n;
  s.done = !s.done; s.doneAt = s.done ? Date.now() : null;
  store.saveItem(it);
  if (!s.done) { toast('Merkt óklárað.'); return; }
  const st1 = stats(), gained = st1.xp - st0.xp, ev = [];
  chain.forEach((c, i) => {
    if (isEvent(c)) return;
    if (!b4[i].done && itemDone(c)) ev.push({ kind: c.parentId ? 'sub' : 'proj', it: c });
    else if (phases(c).length > 1 && donePhases(c) > b4[i].ph) ev.push({ kind: 'phase', it: c, n: donePhases(c), of: phases(c).length });
  });
  const lv1 = level(st1.xp); if (lv1.n > lv0) ev.push({ kind: 'level', lv: lv1 });
  for (const bd of newBadges(st1)) ev.push({ kind: 'badge', b: bd });
  if (ev.length) party(ev, gained);
  else toast(`+${gained} stig. ${['Vel gert.', 'Eitt skref í einu.', 'Flott, þetta er komið.', 'Þetta taldi.'][Math.floor(Math.random() * 4)]}`);
}

    const s2 = $('#j-state'); if (s2) s2.textContent = `Vistað kl. ${fromMin(new Date().getHours() * 60 + new Date().getMinutes())}`; }, 800);
}
window.addEventListener('blur', () => {}, true);
document.addEventListener('focusout', ev => { if (ev.target.id === 'j-text') setTimeout(() => { if (S.view === 'dagbok' && document.activeElement?.id !== 'j-text') { const side = $('#j-side'); if (side) side.innerHTML = journalSide(); } }, 0); });

render();
store.init().then(() => setTimeout(checkReminders, 1500));
initPlatform();
if (!window.claude && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
